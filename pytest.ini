[pytest]
# Kernel-One has NO root-level test suite — this file exists to fail fast and explain.
#
# Every service owns its tests at services/<service>/tests/ and CI
# (.github/workflows/ci.yml) runs each suite as its own
# `python -m pytest tests/ -q` process from services/<service>/.
#
# One pytest process cannot collect across services here: all six ship a test
# package named `tests`, and each tests/conftest.py prepends ITS OWN service root
# to sys.path so helpers resolve with bare imports. In a single process the
# packages collide (ImportPathMismatchError / wrong conftest) — that is exactly
# what happened when someone ran pytest from the repo root without this guard:
# 22 collection errors while every per-service suite passed.
#
# How to run tests:
#   Per service:  cd services/<name> && python -m pytest tests/ -q
#   Repo-wide:    python scripts/run_tests.py   (CI-equivalent, per-service isolation)
#
# If a future root-level tests/ suite lands (docs/15 reserves tests/unit,
# tests/integration, tests/security, tests/e2e), remove this guard together with
# that change and give the root suite a unique package name.
addopts = -p no:cacheprovider
